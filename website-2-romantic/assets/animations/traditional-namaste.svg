<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="auto" role="img" aria-label="Traditional welcoming greeting: Bride in deep red silk saree and Groom in cream formal suit offering Namaste and a respectful bow">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE59F"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997314"/>
    </linearGradient>
    <linearGradient id="tSareeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1425"/>
      <stop offset="50%" stop-color="#6B0F1A"/>
      <stop offset="100%" stop-color="#4E0811"/>
    </linearGradient>
    <linearGradient id="tSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#EDE4D6"/>
      <stop offset="100%" stop-color="#DFD2BF"/>
    </linearGradient>
    <linearGradient id="tSkinGradGroom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A377"/>
      <stop offset="100%" stop-color="#C28B5E"/>
    </linearGradient>
    <linearGradient id="tSkinGradBride" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2B18B"/>
      <stop offset="100%" stop-color="#CF966E"/>
    </linearGradient>
    <radialGradient id="tHaloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDF3DE" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F8E5BD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF6EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="tDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3D0B10" flood-opacity="0.15"/>
    </filter>

    <style>
      /* Base Animation Timings */
      .entrance-group {
        animation: animEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .bow-group {
        transform-origin: 270px 380px;
        animation: animBow 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
      }
      .namaste-hands {
        transform-origin: 270px 270px;
        animation: animNamaste 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
      }
      .diya-glow {
        animation: animGlow 3s ease-in-out infinite alternate;
      }

      /* Keyframes */
      @keyframes animEntrance {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes animNamaste {
        0% {
          opacity: 0.3;
          transform: translateY(18px) scale(0.9);
        }
        70% {
          opacity: 1;
          transform: translateY(-2px) scale(1.05);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes animBow {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(0deg);
        }
        50% {
          /* Respectful gentle bow forward (downward angle) */
          transform: translateY(8px) rotateX(8deg) scaleY(0.98);
        }
        75% {
          transform: translateY(8px) rotateX(8deg) scaleY(0.98);
        }
        100% {
          /* Returns gracefully to resting welcoming pose */
          transform: translateY(0) rotateX(0deg) scaleY(1);
        }
      }

      @keyframes animGlow {
        0% { opacity: 0.6; transform: scale(0.98); }
        100% { opacity: 0.95; transform: scale(1.02); }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .entrance-group, .bow-group, .namaste-hands, .diya-glow {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background Halo Glow -->
  <circle cx="270" cy="220" r="190" fill="url(#tHaloGlow)" class="diya-glow"/>

  <!-- Ornate Arch / Toran at Top (Auspicious Mango Leaves & Golden Marigolds) -->
  <g id="toran-arch" opacity="0.95">
    <path d="M 60 70 Q 270 20 480 70" fill="none" stroke="url(#tGoldGrad)" stroke-width="3"/>
    <path d="M 70 75 Q 170 100 270 75 Q 370 100 470 75" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Hanging Marigold Bells & Mango Leaves -->
    <circle cx="120" cy="85" r="7" fill="#E65100"/>
    <circle cx="120" cy="85" r="5" fill="#FFB300"/>
    <path d="M 120 90 Q 120 105 116 112 Q 124 105 120 90" fill="#2E7D32"/>
    
    <circle cx="200" cy="82" r="7" fill="#E65100"/>
    <circle cx="200" cy="82" r="5" fill="#FFB300"/>
    <path d="M 200 87 Q 200 102 196 109 Q 204 102 200 87" fill="#2E7D32"/>

    <circle cx="270" cy="74" r="9" fill="#C59B27"/>
    <circle cx="270" cy="74" r="6" fill="#FCE59F"/>
    <path d="M 270 82 Q 270 100 265 108 Q 275 100 270 82" fill="#2E7D32"/>

    <circle cx="340" cy="82" r="7" fill="#E65100"/>
    <circle cx="340" cy="82" r="5" fill="#FFB300"/>
    <path d="M 340 87 Q 340 102 336 109 Q 344 102 340 87" fill="#2E7D32"/>

    <circle cx="420" cy="85" r="7" fill="#E65100"/>
    <circle cx="420" cy="85" r="5" fill="#FFB300"/>
    <path d="M 420 90 Q 420 105 416 112 Q 424 105 420 90" fill="#2E7D32"/>
  </g>

  <!-- Animated Couple Group -->
  <g class="entrance-group" filter="url(#tDropShadow)">
    <g class="bow-group" id="couple-bow-target">
      
      <!-- ===============================================================
           GROOM (LEFT): Cream Formal Suit, Crisp White Shirt, Black Bow Tie
           =============================================================== -->
      <g id="groom-figure">
        <!-- Groom Torso / Suit Jacket -->
        <path d="M 140 230 C 140 200, 185 190, 220 190 C 240 190, 255 195, 260 215 L 255 380 C 230 385, 170 385, 145 380 Z" fill="url(#tSuitGrad)"/>
        
        <!-- White Shirt Collar & V-Neck Opening -->
        <polygon points="205,190 235,190 220,245" fill="#FFFFFF"/>
        <line x1="220" y1="210" x2="220" y2="280" stroke="#DFD2BF" stroke-width="1.5"/>

        <!-- Black Bow Tie -->
        <g id="groom-bow-tie">
          <polygon points="210,202 230,202 220,210" fill="#1A1A1A"/>
          <polygon points="210,218 230,218 220,210" fill="#1A1A1A"/>
          <circle cx="220" cy="210" r="3.5" fill="#333333"/>
        </g>

        <!-- Cream Suit Lapels with Fine Stitching -->
        <path d="M 180 192 L 208 255 L 202 330" fill="none" stroke="#D3C3AD" stroke-width="2.5"/>
        <path d="M 252 196 L 226 265 L 232 330" fill="none" stroke="#D3C3AD" stroke-width="2.5"/>

        <!-- Gold Pocket Square & Lapel Flower Motif -->
        <polygon points="172,242 184,236 186,244 174,248" fill="url(#tGoldGrad)"/>
        <circle cx="198" cy="222" r="3" fill="#D4AF37"/>

        <!-- Groom Left Arm (At side, resting comfortably) -->
        <path d="M 142 225 C 130 260, 130 310, 142 345 C 146 355, 154 355, 156 345 C 150 310, 150 265, 160 235 Z" fill="url(#tSuitGrad)"/>
        
        <!-- Groom Neck & Head -->
        <rect x="210" y="172" width="20" height="24" rx="6" fill="url(#tSkinGradGroom)"/>
        
        <!-- Groom Head / Face -->
        <ellipse cx="220" cy="148" rx="28" ry="32" fill="url(#tSkinGradGroom)"/>
        
        <!-- Groom Hair (Neat, modern formal side-part) -->
        <path d="M 190 144 C 188 122, 204 112, 224 112 C 244 112, 252 122, 250 140 C 246 128, 238 122, 222 122 C 204 122, 194 132, 190 144 Z" fill="#221A15"/>
        <path d="M 192 144 C 190 152, 192 158, 195 160 L 196 150 Z" fill="#221A15"/> <!-- Sideburn -->

        <!-- Groom Facial Features (Warm, smiling, respectful) -->
        <!-- Eyes / Brows -->
        <path d="M 202 136 Q 210 133 216 136" fill="none" stroke="#2B1E16" stroke-width="2" stroke-linecap="round"/>
        <path d="M 226 136 Q 232 133 240 136" fill="none" stroke="#2B1E16" stroke-width="2" stroke-linecap="round"/>
        <circle cx="210" cy="144" r="2.5" fill="#221A15"/>
        <circle cx="233" cy="144" r="2.5" fill="#221A15"/>
        <circle cx="211" cy="143" r="0.8" fill="#FFFFFF"/>
        <circle cx="234" cy="143" r="0.8" fill="#FFFFFF"/>
        <!-- Gentle Smile -->
        <path d="M 213 162 Q 221 168 229 162" fill="none" stroke="#7A3928" stroke-width="2" stroke-linecap="round"/>
      </g>


      <!-- ===============================================================
           BRIDE (RIGHT): Deep Red Silk Saree, Gold Zari Border, Gold Jewellery
           =============================================================== -->
      <g id="bride-figure">
        <!-- Bride Saree / Torso & Pleats -->
        <path d="M 276 215 C 285 195, 305 190, 325 190 C 358 190, 395 200, 395 230 L 390 380 C 365 385, 310 385, 280 380 Z" fill="url(#tSareeGrad)"/>
        
        <!-- Traditional Gold Zari Pallu Draped Across Shoulder -->
        <path d="M 370 215 C 340 235, 305 285, 290 340 L 308 350 C 322 300, 355 250, 385 230 Z" fill="url(#tGoldGrad)"/>
        <!-- Elaborate Gold Borders / Zari Lines -->
        <path d="M 370 215 C 340 235, 305 285, 290 340" fill="none" stroke="#FFF0B3" stroke-width="2"/>
        <path d="M 374 218 C 344 238, 309 288, 294 343" fill="none" stroke="#997314" stroke-width="1"/>

        <!-- Gold Waistband (Oddiyanam / Kamarbandh) -->
        <path d="M 292 310 Q 335 320 378 310" fill="none" stroke="url(#tGoldGrad)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="335" cy="315" r="4.5" fill="#D4AF37"/>

        <!-- Bride Neck & Head -->
        <rect x="312" y="172" width="18" height="24" rx="6" fill="url(#tSkinGradBride)"/>

        <!-- Traditional Gold Temple Jewellery (Choker & Manga Malai Necklace) -->
        <path d="M 312 184 Q 321 192 330 184" fill="none" stroke="url(#tGoldGrad)" stroke-width="4.5"/>
        <path d="M 308 192 Q 321 204 334 192" fill="none" stroke="url(#tGoldGrad)" stroke-width="3" stroke-dasharray="3,2"/>
        <circle cx="321" cy="204" r="3" fill="#A31D24"/> <!-- Ruby pendant drop -->

        <!-- Bride Head / Face -->
        <ellipse cx="321" cy="148" rx="26" ry="30" fill="url(#tSkinGradBride)"/>

        <!-- Traditional Hair Bun with Jasmine Garland (Mallipoo / Gajra) -->
        <circle cx="350" cy="144" r="18" fill="#1C1412"/>
        <!-- Jasmine flower ring around bun -->
        <g id="jasmine-gajra">
          <circle cx="356" cy="130" r="4" fill="#FFFFFF"/>
          <circle cx="363" cy="137" r="4" fill="#FFFFFF"/>
          <circle cx="366" cy="146" r="4" fill="#FFFFFF"/>
          <circle cx="362" cy="155" r="4" fill="#FFFFFF"/>
          <circle cx="355" cy="161" r="4" fill="#FFFFFF"/>
          <circle cx="356" cy="130" r="1.5" fill="#FFF59D"/>
          <circle cx="363" cy="137" r="1.5" fill="#FFF59D"/>
          <circle cx="366" cy="146" r="1.5" fill="#FFF59D"/>
          <circle cx="362" cy="155" r="1.5" fill="#FFF59D"/>
          <circle cx="355" cy="161" r="1.5" fill="#FFF59D"/>
        </g>
        
        <!-- Front Hair Parting -->
        <path d="M 295 142 C 298 122, 310 115, 321 115 C 332 115, 344 122, 347 142 C 342 126, 332 122, 321 122 C 310 122, 300 126, 295 142 Z" fill="#1C1412"/>

        <!-- Maang Tikka (Nethi Chutti) & Traditional Red Bindi -->
        <line x1="321" y1="115" x2="321" y2="130" stroke="url(#tGoldGrad)" stroke-width="2"/>
        <circle cx="321" cy="132" r="3" fill="url(#tGoldGrad)"/>
        <circle cx="321" cy="138" r="2.5" fill="#A31D24"/> <!-- Auspicious Kumkum/Bindi -->

        <!-- Traditional Gold Jhumkas (Earrings) -->
        <g id="bride-jhumkas">
          <circle cx="295" cy="155" r="2.5" fill="#D4AF37"/>
          <path d="M 293 158 Q 295 164 297 158 Z" fill="#D4AF37"/>
          <circle cx="347" cy="155" r="2.5" fill="#D4AF37"/>
          <path d="M 345 158 Q 347 164 349 158 Z" fill="#D4AF37"/>
        </g>

        <!-- Bride Facial Features (Graceful, serene smile, almond eyes) -->
        <!-- Eyebrows / Eyes -->
        <path d="M 305 137 Q 312 134 317 137" fill="none" stroke="#2B1E16" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 325 137 Q 330 134 337 137" fill="none" stroke="#2B1E16" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="311" cy="144" rx="2.8" ry="2.2" fill="#221A15"/>
        <ellipse cx="331" cy="144" rx="2.8" ry="2.2" fill="#221A15"/>
        <circle cx="312" cy="143" r="0.7" fill="#FFFFFF"/>
        <circle cx="332" cy="143" r="0.7" fill="#FFFFFF"/>
        <!-- Graceful Smile -->
        <path d="M 314 162 Q 321 168 328 162" fill="none" stroke="#A31D24" stroke-width="2" stroke-linecap="round"/>

        <!-- Bride Left Arm (At side, silk saree sleeve with gold border & glass bangles) -->
        <path d="M 390 230 C 400 260, 400 310, 390 345 C 385 355, 378 355, 375 345 C 382 310, 382 265, 372 235 Z" fill="url(#tSareeGrad)"/>
        <!-- Gold & Red Bangles (Valayal) -->
        <line x1="382" y1="322" x2="394" y2="322" stroke="url(#tGoldGrad)" stroke-width="2.5"/>
        <line x1="382" y1="326" x2="394" y2="326" stroke="#8B1425" stroke-width="2"/>
        <line x1="382" y1="330" x2="394" y2="330" stroke="url(#tGoldGrad)" stroke-width="2.5"/>
      </g>


      <!-- ===============================================================
           NAMASTE GREETING HANDS (ANJALI MUDRA)
           Folded hands in center, symbolizing welcoming reverence
           =============================================================== -->
      <g class="namaste-hands" id="namaste-gesture">
        <!-- Golden Aura of Hospitality Behind Hands -->
        <circle cx="270" cy="272" r="28" fill="#FFF6D8" opacity="0.6"/>
        <circle cx="270" cy="272" r="20" fill="url(#tGoldGrad)" opacity="0.4"/>

        <!-- Hands Folded in Prayer (Anjali Mudra) -->
        <!-- Groom's right arm coming in (Cream sleeve) -->
        <path d="M 230 250 Q 252 260 262 274" fill="none" stroke="url(#tSuitGrad)" stroke-width="14" stroke-linecap="round"/>
        <!-- Bride's right arm coming in (Deep red sleeve with gold zari wrist band) -->
        <path d="M 308 250 Q 288 260 278 274" fill="none" stroke="url(#tSareeGrad)" stroke-width="14" stroke-linecap="round"/>
        <path d="M 302 254 Q 288 263 281 272" fill="none" stroke="url(#tGoldGrad)" stroke-width="3"/>

        <!-- Folded Palms (Namaste Position) -->
        <g id="palms-namaste">
          <!-- Left palm (Groom side) -->
          <path d="M 267 286 C 265 275, 266 256, 269 250 C 270 255, 270 275, 269 286 Z" fill="url(#tSkinGradGroom)"/>
          <!-- Right palm (Bride side) -->
          <path d="M 273 286 C 275 275, 274 256, 271 250 C 270 255, 270 275, 271 286 Z" fill="url(#tSkinGradBride)"/>
          <!-- Fingertips joined in prayer pointing upwards -->
          <path d="M 268 252 C 269 248, 271 248, 272 252 L 273 268 L 267 268 Z" fill="#E2B18B"/>
          <!-- Traditional Mehendi accent on Bride's hand -->
          <circle cx="273" cy="275" r="1.5" fill="#7A2218"/>
        </g>
      </g>

    </g> <!-- end bow-group -->
  </g> <!-- end entrance-group -->

  <!-- Auspicious Diya Lamps at Bottom Base -->
  <g id="diyas" opacity="0.9">
    <!-- Left Diya -->
    <path d="M 90 388 Q 110 398 130 388 Q 110 376 90 388 Z" fill="url(#tGoldGrad)"/>
    <ellipse cx="110" cy="386" rx="16" ry="4" fill="#997314"/>
    <path d="M 110 384 Q 106 372 110 364 Q 114 372 110 384 Z" fill="#FF9800" class="diya-glow"/>
    <circle cx="110" cy="372" r="3" fill="#FFF59D"/>

    <!-- Right Diya -->
    <path d="M 410 388 Q 430 398 450 388 Q 430 376 410 388 Z" fill="url(#tGoldGrad)"/>
    <ellipse cx="430" cy="386" rx="16" ry="4" fill="#997314"/>
    <path d="M 430 384 Q 426 372 430 364 Q 434 372 430 384 Z" fill="#FF9800" class="diya-glow"/>
    <circle cx="430" cy="372" r="3" fill="#FFF59D"/>
  </g>
</svg>
